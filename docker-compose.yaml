services:
  gpsd:
    build:
      context: ./gpsd
      dockerfile: Dockerfile
    restart: unless-stopped
    devices:
      - "${GPS_DEVICE:-/dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_7_-_GPS_GNSS_Receiver-if00}:/dev/gps:rwm"
    group_add:
      - "${GPS_DIALOUT_GID:-20}"
    networks:
      - my_rasp_network

  radio_control:
    container_name: radio-control
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-radio-radio-control:local
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "192.168.1.10:30003:30003"
    environment:
      RADIO_CONTROL_TOKEN: ${RADIO_CONTROL_TOKEN:?Set RADIO_CONTROL_TOKEN in .env}
      OPERATING_MODE: ${OPERATING_MODE:-adsb}
    networks:
      - my_rasp_network

  # Optional raw-IQ server for clients such as SDR#. Run this instead of
  # radio_control because both services need exclusive access to the dongle.
  rtl_tcp:
    container_name: rtl-sdr-v4
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-radio-radio-control:local
    profiles:
      - rtl_tcp
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    entrypoint: ["rtl_tcp"]
    command: ["-a", "0.0.0.0", "-p", "1234"]
    ports:
      - "192.168.1.10:1234:1234"
    networks:
      - my_rasp_network

  adsb_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsb-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BIND_HOST: 0.0.0.0
      API_PORT: 8000
      RADIO_CONTROL_URL: http://radio-control:8090
      GPSD_ENDPOINT: gpsd:2947
    depends_on:
      - radio_control
      - gpsd
    ports:
      - "192.168.1.10:8010:8000"
    networks:
      - my_rasp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adsb-frontend
    restart: unless-stopped
    environment:
      VITE_DEV_API_TARGET: http://adsb_api:8000
    depends_on:
      - adsb_api
    ports:
      - "192.168.1.10:5173:5173"
    networks:
      - my_rasp_network

networks:
  my_rasp_network:
    external: true
    name: my_rasp_network
