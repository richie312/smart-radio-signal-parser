services:
  readsb:
    container_name: readsb
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-radio-readsb:local
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command:
      - --quiet
      - --net
      - --device
      - "0"
      - --device-type
      - rtlsdr
      - --gain
      - auto
      - --net-bind-address
      - 0.0.0.0
      - --net-json-port
      - "30006"
    networks:
      - my_rasp_network

  adsb_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsb-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BIND_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      - readsb
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - my_rasp_network

networks:
  my_rasp_network:
    external: true
    name: my_rasp_network
