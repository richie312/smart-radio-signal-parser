services:
  radio_control:
    container_name: radio-control
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-radio-radio-control:local
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      RADIO_CONTROL_TOKEN: ${RADIO_CONTROL_TOKEN:?Set RADIO_CONTROL_TOKEN in .env}
      OPERATING_MODE: ${OPERATING_MODE:-adsb}
    networks:
      - my_rasp_network

  adsb_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsb-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BIND_HOST: 0.0.0.0
      API_PORT: 8000
      RADIO_CONTROL_URL: http://radio-control:8090
    depends_on:
      - radio_control
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - my_rasp_network

networks:
  my_rasp_network:
    external: true
    name: my_rasp_network
